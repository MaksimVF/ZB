version: '3.8'

services:
  network-config:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-config
    restart: unless-stopped
    ports:
      - "50060:50060"
    environment:
      # Server configuration
      - PORT=50060
      - ENV=production
      - READ_TIMEOUT=30
      - WRITE_TIMEOUT=30
      - IDLE_TIMEOUT=120
      
      # Redis configuration
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=0
      - REDIS_POOL_SIZE=20
      
      # Authentication
      - AUTH_ENABLED=true
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-change-me-in-production}
      - AUTH_ALGORITHM=HS256
      - AUTH_EXPIRATION=3600
      
      # Network configuration
      - NETWORK_MODE=direct
      - LB_STRATEGY=round_robin
      - LB_HEALTH_CHECK=true
      - LB_CHECK_INTERVAL=30
      - RETRY_MAX_RETRIES=3
      - RETRY_BACKOFF_FACTOR=2
      - RETRY_MAX_BACKOFF=10
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPS=100
      - RATE_LIMIT_BURST=200
      
      # Security
      - CORS_ENABLED=true
      - CORS_ALLOWED_ORIGINS=*
      - SECURITY_RATE_LIMIT_ENABLED=true
      - SECURITY_RATE_LIMIT_REQUESTS=1000
      - SECURITY_RATE_LIMIT_WINDOW=1h
      - SECURITY_RATE_LIMIT_SKIP_SUCCESS=false
      
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - LOG_OUTPUT=stdout
      
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - network-config-net
      - default
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:50060/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    security_opt:
      - no-new-privileges:true
    
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - network-config-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    security_opt:
      - no-new-privileges:true

  # Optional: Redis Commander for Redis management UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:${REDIS_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - network-config-net
    profiles:
      - tools

volumes:
  redis_data:
    driver: local

networks:
  network-config-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: network-config-br
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Example environment file (.env)
# Create a .env file with the following variables:
# REDIS_PASSWORD=your_secure_password_here
# AUTH_SECRET_KEY=your_jwt_secret_key_here_minimum_32_characters