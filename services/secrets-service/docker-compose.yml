





version: '3.8'

services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN:-root}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-format=json"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault-network

  secret-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50053:50053"
      - "8082:8082"
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
      - ADMIN_KEY=${ADMIN_KEY:-change-me-in-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - vault-network

  redis:
    image: redis:7.0-alpine
    volumes:
      - redis_data:/data
    networks:
      - vault-network

volumes:
  redis_data:

networks:
  vault-network:
    driver: bridge









