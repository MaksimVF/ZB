syntax = "proto3";

package transactionpb;

option go_package = "github.com/billing-project/go-microservices/transaction-service/internal/proto";

import "google/protobuf/timestamp.proto";

service TransactionService {
    rpc RecordTransaction(TransactionRequest) returns (TransactionResponse);
    rpc GetTransactions(TransactionsRequest) returns (TransactionsResponse);
    rpc GetTransactionByID(TransactionByIDRequest) returns (TransactionResponse);
    rpc CancelTransaction(CancelTransactionRequest) returns (CancelTransactionResponse);
    rpc GetTransactionStats(TransactionStatsRequest) returns (TransactionStatsResponse);
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message Transaction {
    string id = 1;
    string user_id = 2;
    double amount = 3;
    string currency = 4;
    string type = 5; // "deposit", "charge", "refund", "adjustment"
    string status = 6; // "pending", "completed", "failed", "cancelled"
    string description = 7;
    string reference_id = 8;
    map<string, string> metadata = 9;
    google.protobuf.Timestamp created_at = 10;
    google.protobuf.Timestamp processed_at = 11;
}

message TransactionRequest {
    string user_id = 1;
    double amount = 2;
    string currency = 3;
    string type = 4;
    string description = 5;
    string reference_id = 6;
    map<string, string> metadata = 7;
}

message TransactionResponse {
    string transaction_id = 1;
    bool success = 2;
    string status = 3;
    string error = 4;
    Transaction transaction = 5;
    double balance = 6; // Current user balance after transaction
}

message TransactionsRequest {
    string user_id = 1;
    int32 limit = 2;
    int32 offset = 3;
    string status_filter = 4;
    string type_filter = 5;
    google.protobuf.Timestamp date_from = 6;
    google.protobuf.Timestamp date_to = 7;
}

message TransactionsResponse {
    repeated Transaction transactions = 1;
    int32 total = 2;
    int32 count = 3;
    int32 limit = 4;
    int32 offset = 5;
    string error = 6;
}

message TransactionByIDRequest {
    string transaction_id = 1;
}

message CancelTransactionRequest {
    string transaction_id = 1;
    string reason = 2;
    string admin_token = 3;
}

message CancelTransactionResponse {
    bool success = 1;
    string error = 2;
    double refunded_amount = 3;
    google.protobuf.Timestamp cancelled_at = 4;
}

message TransactionStatsRequest {
    string user_id = 1;
    google.protobuf.Timestamp date_from = 2;
    google.protobuf.Timestamp date_to = 3;
}

message TransactionStatsResponse {
    double total_deposits = 1;
    double total_charges = 2;
    double total_refunds = 3;
    double total_adjustments = 4;
    int32 transaction_count = 5;
    string error = 6;
}

message HealthCheckRequest {
    string service_name = 1;
}

message HealthCheckResponse {
    string service = 1;
    string status = 2; // "healthy", "unhealthy"
    string version = 3;
    string time = 4;
    map<string, string> checks = 5;
}