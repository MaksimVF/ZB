syntax = "proto3";

package billing;

option go_package = "github.com/your-org/billing-microservices/pkg/api/billing";

import "google/protobuf/timestamp.proto";

// Balance Service
service BalanceService {
    rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
    rpc UpdateBalance(UpdateBalanceRequest) returns (UpdateBalanceResponse);
    rpc ChargeBalance(ChargeRequest) returns (ChargeResponse);
    rpc CreditBalance(CreditRequest) returns (CreditResponse);
    rpc GetBalanceHistory(GetBalanceHistoryRequest) returns (GetBalanceHistoryResponse);
}

message Balance {
    string user_id = 1;
    double credits = 2;
    double usd = 3;
    google.protobuf.Timestamp updated_at = 4;
}

message BalanceHistory {
    string user_id = 1;
    string operation_type = 2; // "charge", "credit", "adjustment"
    double amount = 3;
    string currency = 4;
    string description = 5;
    google.protobuf.Timestamp timestamp = 6;
}

message GetBalanceRequest {
    string user_id = 1;
}

message GetBalanceResponse {
    Balance balance = 1;
    string error = 2;
}

message UpdateBalanceRequest {
    string user_id = 1;
    double credits = 2;
    double usd = 3;
}

message UpdateBalanceResponse {
    Balance balance = 1;
    string error = 2;
}

message ChargeRequest {
    string user_id = 1;
    double amount = 2;
    string currency = 3;
    string description = 4;
}

message ChargeResponse {
    bool success = 1;
    Balance new_balance = 2;
    string error = 3;
}

message CreditRequest {
    string user_id = 1;
    double amount = 2;
    string currency = 3;
    string description = 4;
}

message CreditResponse {
    bool success = 1;
    Balance new_balance = 2;
    string error = 3;
}

message GetBalanceHistoryRequest {
    string user_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message GetBalanceHistoryResponse {
    repeated BalanceHistory history = 1;
    int32 total = 2;
    string error = 3;
}